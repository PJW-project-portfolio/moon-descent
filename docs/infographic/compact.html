<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Moon Descent HUD Guide</title>
<!--
  한 화면짜리 플레이 가이드: 실제 게임 화면(shots/hud.png) 위에 글상자와 화살표만 올린다.
  PNG 갱신: python scripts/make_infographic.py → play-guide-compact.png
  좌표는 모두 1280×720 게임 화면 기준이며, 내보낼 때 2배(2560×1440)로 렌더링한다.
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=block">
<style>
  @font-face { font-family: "Game Mono"; font-weight: 400; src: url(../../lunar_lander/assets/fonts/DejaVuSansMono.ttf); }
  @font-face { font-family: "Game Mono"; font-weight: 700; src: url(../../lunar_lander/assets/fonts/DejaVuSansMono-Bold.ttf); }

  :root {
    --bg: #04080a;
    --phos: #b4ffca;
    --amber: #ffc15c;
    --white: #e6f5ec;
    --text: #cfe3d8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; background: var(--bg); }
  body {
    position: relative;
    font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    word-break: keep-all;
    -webkit-font-smoothing: antialiased;
  }
  /* 게임 화면은 손대지 않고 정수 배율로만 키운다. */
  .screen { position: absolute; inset: 0; width: 1280px; height: 720px; image-rendering: pixelated; }
  svg.layer { position: absolute; inset: 0; }

  .box {
    position: absolute;
    background: rgba(4, 8, 10, .85);
    border: 1.5px solid var(--phos);
    border-radius: 6px;
    padding: 7px 12px 8px;
    color: var(--text);
    font-size: 15px;
    line-height: 1.4;
    white-space: nowrap;
  }
  .box .t { color: var(--white); font-weight: 700; font-size: 17px; line-height: 1.4; }
  .box b { color: var(--white); font-weight: 700; margin-right: 6px; }
  .box em { font-style: normal; font-weight: 700; color: var(--amber); }
  .box .m { font-family: "Game Mono", monospace; font-size: 14px; }

  .vlabel { font-family: "Noto Sans KR", sans-serif; paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
</style>
</head>
<body>
  <img class="screen" src="shots/hud.png" alt="">

  <svg class="layer" width="1280" height="720" viewBox="0 0 1280 720">
    <defs>
      <marker id="lead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4ffca"/></marker>
      <marker id="v-thrust" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ffc15c"/></marker>
      <marker id="v-grav" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6fd3ff"/></marker>
      <marker id="v-entry" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e6f5ec"/></marker>
    </defs>

    <!-- 설명 화살표 (가는 선) -->
    <g fill="none" stroke="#b4ffca" stroke-width="1.5" stroke-linejoin="round">
      <!-- 스테이지 / 목숨 -->
      <path d="M250,74 L192,84" marker-end="url(#lead)"/>
      <path d="M250,119 L112,110" marker-end="url(#lead)"/>
      <!-- 연료 바 -->
      <path d="M250,166 L226,142" marker-end="url(#lead)"/>
      <!-- 비행 계기: H-S·V-S 두 줄을 묶는 괄호 -->
      <path d="M1099,52 L1094,52 L1094,96 L1099,96"/>
      <path d="M1074,104 L1090,78" marker-end="url(#lead)"/>
      <!-- 패드 위치 안내 (좌하단): 왼쪽 화면 밖 안내 · 레이더.
           레이더로 가는 선은 착륙선 왼쪽(x=560)으로 올라가 기체와 벡터를 피한다. -->
      <path d="M80,476 L80,222" marker-end="url(#lead)"/>
      <path d="M428,500 L560,500 L560,40" marker-end="url(#lead)"/>
      <!-- 착륙 패드 -->
      <path d="M900,470 L852,598" marker-end="url(#lead)"/>
    </g>

    <!-- 착륙선 벡터: 질량 중심 (640, 440), 기체는 왼쪽으로 10° 기울어져 있다 -->
    <!-- 추력 허용 범위: 수직 기준 ±12° -->
    <path d="M640,440 L619.2,342.2 A100,100 0 0 1 660.8,342.2 Z" fill="#ffc15c" fill-opacity=".12" stroke="none"/>
    <path d="M619.2,342.2 A100,100 0 0 1 660.8,342.2" fill="none" stroke="#ffc15c" stroke-width="1.5" stroke-opacity=".8"/>
    <g stroke="#ffc15c" stroke-width="1.2" stroke-dasharray="3 3" opacity=".8">
      <line x1="640" y1="440" x2="619.2" y2="342.2"/><line x1="640" y1="440" x2="660.8" y2="342.2"/>
    </g>
    <line x1="640" y1="440" x2="640" y2="328" stroke="#e6f5ec" stroke-width="1.3" stroke-dasharray="4 4" opacity=".75"/>
    <!-- 벡터 (굵은 선) -->
    <line x1="640" y1="440" x2="619.2" y2="321.8" stroke="#ffc15c" stroke-width="3.5" marker-end="url(#v-thrust)"/>
    <line x1="640" y1="440" x2="640" y2="522" stroke="#6fd3ff" stroke-width="3.5" marker-end="url(#v-grav)"/>
    <line x1="640" y1="440" x2="742" y2="440" stroke="#e6f5ec" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#v-entry)"/>
    <circle cx="640" cy="440" r="3.6" fill="#e6f5ec" stroke="#04080a" stroke-width="1.5"/>

    <!-- 벡터 라벨 -->
    <text class="vlabel" x="630" y="296" fill="#ffc15c" font-size="17" font-weight="700">추력</text>
    <text class="vlabel" x="630" y="317" fill="#e6f5ec" font-size="15" font-weight="500">착륙 시 수직과 <tspan fill="#ffc15c" font-weight="700">12°</tspan> 이내</text>
    <text class="vlabel" x="652" y="524" fill="#6fd3ff" font-size="17" font-weight="700">중력</text>
    <text class="vlabel" x="752" y="446" fill="#e6f5ec" font-size="17" font-weight="700">진입 속도</text>
  </svg>

  <!-- 글상자 -->
  <div class="box" style="left:250px;top:55px"><b>스테이지</b>달 → 화성 → 금성, 총 <em>3</em>단계</div>
  <div class="box" style="left:250px;top:100px"><b>목숨</b>게임 전체 <em>3</em>개, 추락할 때마다 1개 감소</div>
  <div class="box" style="left:250px;top:146px;width:230px;white-space:normal">
    <div class="t">연료량</div>
    추력을 쓰면 줄어듦<br>빨리 착륙하면 다음 스테이지에 <em>시간 보너스 연료</em> 추가
  </div>
  <div class="box" style="left:762px;top:64px;width:312px">
    <div class="t">착륙 인정 조건</div>
    횡방향(<span class="m">H-S</span>) <em>3.5 m/s</em> 이내,<br>
    수직방향(<span class="m">V-S</span>) 하강 중 <em>4.5 m/s</em> 이내일 때만<br>
    착륙으로 인정
  </div>
  <div class="box" style="left:28px;top:476px;width:400px">
    <div class="t">패드 위치 안내</div>
    상단 막대: 맵 전체의 패드(숫자 = 배율)와 내 위치(흰 눈금)<br>
    화면 가장자리: 화면 밖 패드의 방향 · 배율 · 거리
  </div>
  <div class="box" style="left:884px;top:388px;width:300px">
    <div class="t">착륙 패드</div>
    두 발판이 모두 이 안에 닿아야 함<br>(<em>x4</em> = 점수 배율)
  </div>
</body>
</html>
